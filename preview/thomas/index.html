<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>This should be you, Thomas</title>
<style>
  :root { --navy: #1A2A52; --gold: #C9A04A; --steel: #6E8AA8; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--navy); color: #fff;
    font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { padding: 22px 24px; }
  header img { height: 84px; width: auto; display: block; background: #fff; border-radius: 14px; padding: 6px; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px 60px; text-align: center; }
  .in { max-width: 760px; }
  .rule { width: 72px; height: 4px; background: var(--gold); border-radius: 4px; margin: 0 auto 28px; }
  h1 { margin: 0 0 18px; font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(44px, 9vw, 92px); line-height: 1.02; }
  h1 span { color: var(--gold); }
  p { margin: 0 auto 30px; max-width: 34em; color: #C9D3E6; }
  .btn { display: inline-block; background: var(--gold); color: var(--navy); font-weight: 800; text-decoration: none; padding: 15px 26px; border-radius: 999px; }
  footer { padding: 18px 24px 26px; text-align: center; font-size: 14px; color: #9FB0CC; }
  footer a { color: #fff; }
</style>
</head>
<body>
  <header><img src="gelp-logo.webp" alt="GELP Strategies"></header>
  <main><div class="in">
    <div class="rule"></div>
    <h1>This should be you, <span>Thomas.</span></h1>
    <p>GELP Strategies. Healthcare marketing and growth, built around your business.</p>
    <a class="btn" href="https://gelpstrategies.com/call" target="_blank" rel="noopener">Schedule a call</a>
  </div></main>
  <footer><a href="https://gelpstrategies.com" target="_blank" rel="noopener">gelpstrategies.com</a> · info@gelpstrategies.com</footer>
</body>
</html>
