<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Book a time</title>
  <link rel="icon" href="../favicon.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #F3F5F9; color: #1d2433; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; --brand: #1A2A52; }
    body.embed { background: transparent; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 24px 14px 60px; }
    body.embed .wrap { padding: 6px 4px 10px; }
    .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 3px rgba(20, 30, 50, .08); }
    .top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 3px solid var(--brand); }
    .top img { max-height: 44px; max-width: 220px; }
    .top b { font-size: 18px; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    .meta { color: #5B6B8A; margin: 0 0 6px; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 15px; }
    .desc { color: #3b4659; margin: 6px 0 14px; white-space: pre-wrap; }
    .cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 22px; margin-top: 10px; }
    .mhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .mhead b { font-size: 17px; }
    .nav { border: 1px solid #ccd3e0; background: #fff; border-radius: 8px; width: 40px; height: 40px; font-size: 18px; cursor: pointer; }
    .nav:disabled { opacity: .35; cursor: default; }
    .month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .month .dh { font-size: 12px; color: #5B6B8A; font-weight: 700; padding: 4px 0; }
    .month button { border: 0; background: transparent; border-radius: 50%; aspect-ratio: 1; font: inherit; font-size: 15px; color: #9aa3b5; cursor: default; max-width: 46px; width: 100%; margin: 0 auto; }
    .month button.open { background: color-mix(in srgb, var(--brand) 12%, #fff); color: var(--brand); font-weight: 700; cursor: pointer; }
    .month button.on { background: var(--brand); color: #fff; }
    .times { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; max-height: 360px; overflow: auto; }
    .times button { border: 1px solid var(--brand); color: var(--brand); background: #fff; border-radius: 8px; padding: 10px 6px; font: inherit; font-weight: 700; cursor: pointer; min-height: 44px; }
    .times button:hover { background: color-mix(in srgb, var(--brand) 8%, #fff); }
    label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 4px; }
    input, textarea, select { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid #ccd3e0; border-radius: 8px; background: #fff; min-height: 44px; }
    textarea { min-height: 84px; }
    .row { display: flex; gap: 10px; } .row > div { flex: 1; min-width: 0; }
    .go { margin-top: 16px; width: 100%; background: var(--brand); color: #fff; border: 0; border-radius: 10px; padding: 14px; font: inherit; font-weight: 700; cursor: pointer; min-height: 48px; }
    .go:disabled { opacity: .6; }
    .ghost { background: #fff; color: var(--brand); border: 1px solid var(--brand); }
    .link { background: none; border: 0; color: var(--brand); text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }
    .hint { color: #5B6B8A; font-size: 13px; margin: 4px 0 0; }
    .err { color: #B4412C; margin-top: 10px; }
    .state { text-align: center; color: #5B6B8A; padding: 50px 10px; }
    .pick { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 12px; }
    .pick button { border: 1px solid #ccd3e0; background: #fff; border-radius: 999px; padding: 8px 14px; font: inherit; cursor: pointer; min-height: 40px; }
    .pick button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
    .chosen { background: #F3F5F9; border-radius: 10px; padding: 10px 12px; margin: 0 0 6px; }
    .ok { text-align: center; padding: 20px 6px; }
    .ok .big { font-size: 40px; line-height: 1; }
    .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .tzrow { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: #5B6B8A; }
    .tzrow select { width: auto; min-height: 36px; padding: 4px 8px; font-size: 13px; }
    @media (max-width: 680px) { .cols { grid-template-columns: 1fr; } .row { flex-direction: column; gap: 0; } h1 { font-size: 21px; } }
  </style>
</head>
<body>
  <div class="wrap"><div class="card" id="root"><div class="state">Loading…</div></div></div>
  <script type="module" src="./book.js?v=20261116t"></script>
</body>
</html>
