<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#1A2A52">
  <title>Client portal</title>
  <link rel="icon" href="../favicon.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    :root { --brand: #1A2A52; --ink: #1d2433; --muted: #5B6B8A; --line: #e3e7ef; --bg: #F3F5F9; --ok: #2A6B4F; --bad: #B4412C; --gold: #8a6100; }
    body { background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
    a { color: var(--brand); }
    button, input, select, textarea { font: inherit; color: inherit; }
    .top { background: #fff; border-bottom: 3px solid var(--brand); position: sticky; top: 0; z-index: 5; }
    .topin { max-width: 960px; margin: 0 auto; padding: 10px 14px; display: flex; gap: 12px; align-items: center; }
    .brand { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
    .brand img { max-height: 38px; max-width: 170px; object-fit: contain; }
    .brand b { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand small { display: block; color: var(--muted); font-size: 13px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tabs { max-width: 960px; margin: 0 auto; padding: 0 8px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; margin-bottom: -3px; }
    .tabs button.on { color: var(--brand); border-bottom-color: var(--brand); }
    .tabs .dot { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--brand); color: #fff; font-size: 12px; line-height: 18px; text-align: center; margin-left: 4px; }
    main { max-width: 960px; margin: 0 auto; padding: 16px 14px 60px; }
    h1 { font-size: 22px; margin: 4px 0 14px; }
    h2 { font-size: 17px; margin: 0 0 10px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .tile { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: left; cursor: pointer; }
    .tile b { display: block; font-size: 22px; color: var(--brand); }
    .tile span { color: var(--muted); font-size: 14px; }
    .row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .row > .grow { flex: 1; min-width: 0; }
    .row small { display: block; color: var(--muted); font-size: 14px; }
    .when { min-width: 62px; text-align: center; background: var(--bg); border-radius: 10px; padding: 6px 4px; line-height: 1.15; flex: none; }
    .when b { display: block; font-size: 20px; }
    .when small { font-size: 12px; text-transform: uppercase; }
    .btn { display: inline-block; background: var(--brand); color: #fff; border: 0; border-radius: 9px; padding: 10px 16px; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid #ccd3e0; font-weight: 600; }
    .btn.small { padding: 7px 12px; font-size: 14px; }
    .btn.danger { color: var(--bad); }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn.block { display: block; width: 100%; }
    .badge { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 8px; background: #e9edf4; color: var(--muted); vertical-align: middle; }
    .badge.ok { background: #e3f1e8; color: var(--ok); } .badge.due { background: #fbe6e1; color: var(--bad); } .badge.gold { background: #fff1d6; color: var(--gold); }
    .empty { color: var(--muted); }
    .hint { color: var(--muted); font-size: 14px; }
    label.l { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
    input[type=text], input[type=email], input[type=password], textarea, select { width: 100%; padding: 11px 12px; border: 1px solid #ccd3e0; border-radius: 9px; background: #fff; }
    textarea { min-height: 80px; resize: vertical; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .err { color: var(--bad); font-size: 14px; margin-top: 8px; }
    .auth { max-width: 420px; margin: 8vh auto 40px; padding: 0 14px; }
    .auth .logo { text-align: center; margin-bottom: 18px; }
    .auth .logo img { max-height: 60px; max-width: 240px; }
    .auth .logo b { font-size: 24px; color: var(--brand); }
    .banner { background: #fff1d6; color: #5c4100; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 15px; }
    .welcome { background: #fff; border-left: 4px solid var(--brand); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
    .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .photos a { display: block; border-radius: 10px; overflow: hidden; background: #e9edf4; aspect-ratio: 1; }
    .photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photos figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .msgs { display: flex; flex-direction: column; gap: 8px; max-height: 58vh; overflow-y: auto; padding: 4px 2px 10px; }
    .msg { max-width: 82%; padding: 9px 12px; border-radius: 14px; background: #e9edf4; align-self: flex-start; white-space: pre-wrap; word-wrap: break-word; }
    .msg.me { background: var(--brand); color: #fff; align-self: flex-end; }
    .msg small { display: block; font-size: 12px; opacity: .75; margin-top: 2px; }
    .compose { display: flex; gap: 8px; align-items: flex-end; margin-top: 8px; }
    .compose textarea { min-height: 48px; }
    .menu { position: relative; }
    .menu .pop { position: absolute; right: 0; top: 44px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.12); min-width: 230px; padding: 6px; z-index: 10; }
    .menu .pop button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
    .menu .pop button:hover { background: var(--bg); }
    .menu .pop small { display: block; padding: 6px 12px; color: var(--muted); }
    .levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px 12px; margin-top: 8px; }
    .levels label { font-size: 14px; color: var(--muted); }
    .levels select { padding: 7px 8px; margin-top: 2px; }
    .check { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 15px; }
    .check input { width: 20px; height: 20px; }
    .docwrap { margin: 0 -14px; }
    .docbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .foot { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 14px 40px; }
    .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #1d2433; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 50; max-width: 92vw; font-size: 15px; }
    .toast.bad { background: var(--bad); }
    .mfaqr { text-align: center; margin: 10px 0; }
    @media (max-width: 600px) { .brand img { max-height: 32px; max-width: 120px; } .docwrap { margin: 0 -10px; } main { padding: 12px 10px 60px; } }
    @media print { .top, .docbar, .foot { display: none; } body { background: #fff; } main { padding: 0; } }
  </style>
  <style id="docCss"></style>
</head>
<body>
  <div id="app"><div class="auth"><p class="empty" style="text-align:center">Loading…</p></div></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="portal.js?v=20261116t"></script>
</body>
</html>
