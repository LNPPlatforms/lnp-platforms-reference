<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Connecting Microsoft…</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #F3F5F9; color: #1A2A52; }
    .box { background: #fff; border: 1px solid #DCE2EC; border-radius: 12px; padding: 28px 32px; max-width: 420px; text-align: center; box-shadow: 0 10px 30px -14px rgba(16,30,60,.3); }
    h1 { font-size: 20px; margin: 0 0 8px; } p { color: #5B6B8A; margin: 0 0 16px; line-height: 1.5; }
    a { display: inline-block; background: #1A2A52; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <!-- Microsoft sends people back here after they sign in. This page hands the one-time code to the server
       (ms-graph "finish"), which saves the connection, then sends them back to where they started. -->
  <div class="box"><h1 id="t">Connecting Microsoft…</h1><p id="m">One moment while we finish connecting your account.</p><a id="back" href="/" hidden>Back to the CRM</a></div>
  <script type="module">
    import { SUPABASE_URL, SUPABASE_KEY } from '/config.js';
    const q = new URLSearchParams(location.search);
    const show = (t, m, href) => { document.getElementById('t').textContent = t; document.getElementById('m').textContent = m; const b = document.getElementById('back'); if (href) b.href = href; b.hidden = false; };
    try {
      const r = await fetch(`${SUPABASE_URL}/functions/v1/ms-graph`, { method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
        body: JSON.stringify({ kind: 'finish', code: q.get('code'), state: q.get('state'), error: q.get('error'), error_description: q.get('error_description') }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) {
        const msg = /AADSTS65001|consent|admin/i.test(j.error || '') ? 'Your company\'s Microsoft admin needs to approve this app first. Ask them to approve the app for your organization, then try again.' : (j.error || 'Something went wrong. Try again from your profile.');
        show('Microsoft isn\'t connected', msg, j.return_to || '/');
      } else {
        show('Microsoft connected', `Connected as ${j.email}. Your Outlook busy times now block bookings. Taking you back…`, j.return_to || '/');
        setTimeout(() => { location.replace(j.return_to || '/'); }, 1500);
      }
    } catch (e) { show('Microsoft isn\'t connected', 'We couldn\'t reach the server. Check your connection and try again from your profile.', '/'); }
  </script>
</body>
</html>
