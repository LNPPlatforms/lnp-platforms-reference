<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A2A52">
  <title>Directory</title>
  <link rel="icon" href="../favicon.png" type="image/png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root { --p: #1A2A52; --a: #C9A04A; --bg: #F4F6FA; --card: #fff; --line: #DCE2EC; --text: #18223D; --soft: #5B6B8A; --muted: #7C8AA6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
    a { color: inherit; }
    button { font: inherit; }
    .top { background: var(--p); color: #fff; padding: 22px 16px 26px; }
    .top .in { max-width: 1180px; margin: 0 auto; display: flex; gap: 16px; align-items: center; }
    .top img { max-height: 56px; max-width: 160px; background: #fff; border-radius: 10px; padding: 6px; }
    .top h1 { margin: 0; font-size: clamp(22px, 4vw, 32px); line-height: 1.15; }
    .top p { margin: 4px 0 0; opacity: .85; }
    .bar { max-width: 1180px; margin: -18px auto 0; padding: 0 16px; position: relative; z-index: 2; }
    .search { display: flex; gap: 8px; background: var(--card); border-radius: 14px; padding: 8px; box-shadow: 0 6px 24px rgba(20, 30, 60, .12); }
    .search input { flex: 1; min-width: 0; border: 0; font-size: 17px; padding: 10px 8px; outline: none; background: transparent; color: var(--text); }
    .btn { border: 0; background: var(--a); color: #111; font-weight: 700; border-radius: 10px; padding: 10px 14px; cursor: pointer; white-space: nowrap; }
    .btn.ghost { background: transparent; color: var(--p); border: 1px solid var(--line); }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 0; }
    .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 14px; }
    .chip.on { background: var(--p); color: #fff; border-color: var(--p); }
    .chips.sub .chip { font-size: 13px; padding: 5px 12px; }
    .crumb { margin: 10px 0 0; font-size: 14px; color: var(--soft); }
    .crumb button { border: 0; background: none; color: var(--p); text-decoration: underline; cursor: pointer; padding: 0; }
    main { max-width: 1180px; margin: 0 auto; padding: 14px 16px 60px; display: grid; gap: 16px; grid-template-columns: 1fr; }
    @media (min-width: 900px) { main.withmap { grid-template-columns: minmax(0, 1fr) 440px; } #mapWrap { position: sticky; top: 12px; align-self: start; } }
    #map { height: 300px; border-radius: 14px; border: 1px solid var(--line); background: #e8ecf3; }
    @media (min-width: 900px) { #map { height: calc(100vh - 40px); max-height: 720px; } }
    .count { color: var(--soft); font-size: 14px; margin: 0 0 8px; }
    .list { display: grid; gap: 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; gap: 14px; cursor: pointer; text-align: left; width: 100%; color: inherit; }
    .card:hover, .card:focus-visible { border-color: var(--p); outline: none; }
    .card.feat { border-left: 4px solid var(--a); }
    .logo { width: 56px; height: 56px; flex: 0 0 56px; border-radius: 10px; border: 1px solid var(--line); background: #fff center/contain no-repeat; display: grid; place-items: center; font-weight: 800; color: var(--p); font-size: 20px; }
    .card h3 { margin: 0; font-size: 17px; line-height: 1.25; }
    .card .sub { color: var(--soft); font-size: 14px; margin-top: 2px; }
    .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #F5ECD8; color: #7a5a14; margin-left: 6px; vertical-align: 2px; }
    .dist { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .empty { text-align: center; color: var(--soft); padding: 40px 10px; }
    .state { max-width: 560px; margin: 60px auto; text-align: center; padding: 0 16px; color: var(--soft); }
    .note { max-width: 1180px; margin: 10px auto 0; padding: 8px 16px; }
    .note div { background: #FBF0D3; color: #6b4c00; border-radius: 10px; padding: 8px 12px; font-size: 14px; }
    dialog { border: 0; border-radius: 16px; padding: 0; width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: 0 20px 60px rgba(0,0,0,.25); color: var(--text); }
    dialog::backdrop { background: rgba(15, 22, 40, .5); }
    .dhead { background: var(--p); color: #fff; padding: 18px 18px 16px; display: flex; gap: 14px; align-items: center; }
    .dhead .logo { border: 0; }
    .dhead h2 { margin: 0; font-size: 21px; line-height: 1.2; }
    .dhead p { margin: 2px 0 0; opacity: .85; font-size: 14px; }
    .x { margin-left: auto; border: 0; background: rgba(255,255,255,.15); color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; flex: 0 0 36px; }
    .dbody { padding: 16px 18px 20px; }
    .acts { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
    .acts a { text-decoration: none; }
    .dbody h4 { margin: 16px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .dbody p { margin: 0; white-space: pre-line; }
    .svc { display: flex; gap: 6px; flex-wrap: wrap; }
    .svc span { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 14px; }
    #dmap { height: 200px; border-radius: 12px; margin-top: 14px; border: 1px solid var(--line); }
    .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 6px; }
    .gal a { display: block; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
    .gal img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
    .gal figcaption { font-size: 12px; color: var(--soft); padding: 4px 6px; }
    .form label { display: block; font-size: 13px; font-weight: 700; color: var(--soft); margin: 10px 0 4px; }
    .form input, .form textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; color: var(--text); background: #fff; }
    .form textarea { min-height: 110px; resize: vertical; }
    .form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 520px) { .form .two { grid-template-columns: 1fr; } }
    .err { color: #B4412C; font-size: 14px; margin-top: 8px; min-height: 1em; }
    .ok { background: #E3F3EA; color: #2F7A55; border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
    .msgs { display: grid; gap: 8px; margin: 6px 0 12px; }
    .bub { background: #F5ECD8; border-radius: 12px; padding: 8px 12px; max-width: 85%; white-space: pre-line; }
    .bub.me { background: #EEF2F8; margin-left: auto; }
    .bub small { display: block; color: var(--muted); font-size: 12px; }
    .signin { max-width: 380px; margin: 30px auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
    .memberbar { max-width: 1180px; margin: 10px auto 0; padding: 0 16px; font-size: 14px; color: var(--soft); text-align: right; }
    .memberbar button { border: 0; background: none; color: var(--p); text-decoration: underline; cursor: pointer; }
    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 30px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .livest { font-size: 13px; color: #5B6B8A; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  .livest .dot { width: 9px; height: 9px; border-radius: 50%; background: #B8C0CF; display: inline-block; }
  .livest .dot.on { background: #2F9E62; }
  .msgs { max-height: 50vh; overflow: auto; }
</style>
</head>
<body>
  <div id="root"><div class="state">Loading…</div></div>
  <dialog id="dlg" aria-labelledby="dName"></dialog>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/chat/widget.js" data-manual async></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
    import { SUPABASE_URL, SUPABASE_KEY } from '../config.js';
    // Signed-in CRM users of the account see drafts and members-only directories as a preview.
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: false } });
    const qs = new URLSearchParams(location.search);
    const APP_HOSTS = ['app.gelpstrategies.com', 'localhost', '127.0.0.1', 'local.test'];
    const key = qs.get('d') || (APP_HOSTS.includes(location.hostname) ? '' : location.hostname);
    const root = document.getElementById('root'), dlg = document.getElementById('dlg');
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const apple = /iphone|ipad|ipod|macintosh/i.test(navigator.userAgent), android = /android/i.test(navigator.userAgent);
    const mapHref = (q) => android ? 'geo:0,0?q=' + encodeURIComponent(q) : apple ? 'https://maps.apple.com/?q=' + encodeURIComponent(q) : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
    const addr = (l) => [l.address, l.city, [l.state, l.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');
    const tel = (p) => 'tel:' + String(p || '').replace(/[^\d+]/g, '');
    const site = (u) => /^https?:\/\//i.test(u) ? u : 'https://' + u;
    const hexOk = (h) => /^#[0-9a-f]{6}$/i.test(h || '');
    const miles = (a, b) => { const R = 3958.8, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r;
      const x = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
    const initials = (n) => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();

    let D = null, cat = '', q = '', origin = null, originLabel = '', map = null, layer = null, dmap = null;
    const track = (listing, kind) => { if (D?.status === 'live' && !D.preview) sb.rpc('directory_track', { p_directory: D.id, p_listing: listing, p_kind: kind }).then(() => {}, () => {}); };

    if (!key) root.innerHTML = '<div class="state">This directory link is missing its name.</div>';
    else load();

    async function load() {
      const { data, error } = await sb.rpc('directory_public', { p_slug: key });
      if (error) { root.innerHTML = '<div class="state">We couldn\'t load this directory right now. Refresh to try again.</div>'; return; }
      if (!data) { root.innerHTML = '<div class="state">This directory isn\'t available.</div>'; return; }
      D = data;
      document.title = D.name;
      const c = D.colors || {};
      if (hexOk(c.primary)) { document.documentElement.style.setProperty('--p', c.primary); document.querySelector('meta[name=theme-color]').content = c.primary; }
      if (hexOk(c.accent)) document.documentElement.style.setProperty('--a', c.accent);
      if (D.members_only) {
        root.innerHTML = `${header()}<form class="signin form" id="si"><b style="font-size:18px">This directory is for members</b>
          <p style="margin:6px 0 0;color:var(--soft)">Sign in with the login you use for your listing.</p>
          <label for="siE">Email</label><input id="siE" type="email" autocomplete="email" required>
          <label for="siP">Password</label><input id="siP" type="password" autocomplete="current-password" required>
          <div class="err" id="siErr"></div><button class="btn" style="width:100%;margin-top:6px" type="submit">Sign in</button>
          <p style="font-size:13px;color:var(--soft);margin:12px 0 0">Forgot your password or need a login? Use <a href="/">the sign-in page</a>, or ask the directory's team for an invite.</p></form>`;
        document.getElementById('si').onsubmit = async (e) => {
          e.preventDefault(); const er = document.getElementById('siErr'); er.textContent = '';
          const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('siE').value.trim(), password: document.getElementById('siP').value });
          if (error) { er.textContent = /invalid/i.test(error.message) ? 'That email and password don\'t match.' : error.message; return; }
          load();
        };
        return;
      }
      const h = new URLSearchParams(location.hash.slice(1));
      cat = h.get('c') && D.categories.some((x) => x.id === h.get('c')) ? h.get('c') : '';
      q = h.get('q') || '';
      render();
      track(null, 'directory_view');
      const open = h.get('l'); if (open && D.listings.some((l) => l.id === open)) show(open);
      if (h.get('t') && h.get('k')) conversation(h.get('t'), h.get('k'));
      // a chat started earlier comes back in the corner, so replies show up
      try { const c = JSON.parse(localStorage.getItem('dirChat:' + D.id) || 'null'); if (c && D.listings.some((l) => l.id === c.ref && l.chat === c.account)) openChat(c, false); } catch {}
    }

    function header() {
      return `<header class="top"><div class="in">${D.logo ? `<img src="${esc(D.logo)}" alt="">` : ''}<div><h1>${esc(D.name)}</h1>${D.tagline ? `<p>${esc(D.tagline)}</p>` : ''}</div></div></header>`;
    }
    const kids = (pid) => D.categories.filter((x) => (x.parent || '') === (pid || ''));
    const under = (id) => { const out = new Set([id]); let grew = true; while (grew) { grew = false; D.categories.forEach((x) => { if (x.parent && out.has(x.parent) && !out.has(x.id)) { out.add(x.id); grew = true; } }); } return out; };
    const pathTo = (id) => { const p = []; let x = D.categories.find((c) => c.id === id); while (x) { p.unshift(x); x = D.categories.find((c) => c.id === x.parent); } return p; };
    const placeOf = (id) => pathTo(id).reverse().find((x) => x.lat != null && x.lng != null);

    function filtered() {
      const set = cat ? under(cat) : null, t = q.trim().toLowerCase();
      let rows = D.listings.filter((l) => (!set || (l.cats || []).some((c) => set.has(c)))
        && (!t || [l.name, l.tagline, l.city, l.description, ...(l.services || []), ...(l.cats || []).map((c) => D.categories.find((x) => x.id === c)?.name)].join(' ').toLowerCase().includes(t)));
      const from = origin || (cat && placeOf(cat)) || null;
      if (from) rows = rows.map((l) => ({ ...l, _mi: l.lat != null ? miles(from, l) : null }))
        .sort((a, b) => (b.featured - a.featured) || ((a._mi ?? 1e9) - (b._mi ?? 1e9)) || a.name.localeCompare(b.name));
      return { rows, from };
    }

    function render() {
      const top = kids(''), path = cat ? pathTo(cat) : [], cur = path[path.length - 1];
      const level = cur ? kids(cur.id) : [];
      const { rows, from } = filtered();
      const fromLabel = origin ? originLabel : from ? from.place || from.name : '';
      const withMap = D.show_map && D.listings.some((l) => l.lat != null);
      root.innerHTML = `${header()}
        ${D.member_view ? '<div class="memberbar">Signed in as a member · <button id="soMem">Sign out</button></div>' : ''}
        ${D.preview ? `<div class="note"><div>Preview for your team${D.status !== 'live' ? '. This directory is a draft and isn\'t public yet.' : '.'} Visits from signed-in team members aren't counted.</div></div>` : ''}
        <div class="bar">
          <form class="search" id="sf" role="search"><label class="sr" for="sq">Search</label><input id="sq" type="search" placeholder="Search businesses, services or towns" value="${esc(q)}" autocomplete="off">
            <button class="btn ghost" type="button" id="near">${origin ? 'Near me ✓' : 'Near me'}</button></form>
          ${top.length ? `<div class="chips" role="list"><button class="chip ${!cat ? 'on' : ''}" data-cat="">All</button>${top.map((c) => `<button class="chip ${path[0]?.id === c.id ? 'on' : ''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('')}</div>` : ''}
          ${path.length > 1 ? `<div class="crumb">${path.map((c, i) => i < path.length - 1 ? `<button data-cat="${c.id}">${esc(c.name)}</button> › ` : `<b>${esc(c.name)}</b>`).join('')}</div>` : ''}
          ${level.length ? `<div class="chips sub">${level.map((c) => `<button class="chip" data-cat="${c.id}">${esc(c.name)}</button>`).join('')}</div>` : ''}
        </div>
        <main class="${withMap ? 'withmap' : ''}">
          <section><p class="count">${rows.length} ${rows.length === 1 ? 'listing' : 'listings'}${cur ? ' in ' + esc(cur.name) : ''}${fromLabel ? `, nearest to ${esc(fromLabel)}` : ''}</p>
            <div class="list" id="list">${rows.map(card).join('') || '<div class="empty">Nothing matches yet. Try another search or category.</div>'}</div></section>
          ${withMap ? '<aside id="mapWrap"><div id="map" role="region" aria-label="Map of listings"></div></aside>' : ''}
        </main>
        <footer>Directory powered by GELP Strategies</footer>`;
      document.querySelectorAll('[data-cat]').forEach((b) => (b.onclick = () => { cat = b.dataset.cat; origin = origin; setHash(); render(); }));
      const sq = document.getElementById('sq');
      let t; sq.oninput = () => { clearTimeout(t); t = setTimeout(() => { q = sq.value; setHash(); refreshList(); }, 200); };
      document.getElementById('sf').onsubmit = (e) => { e.preventDefault(); q = sq.value; setHash(); refreshList(); };
      document.getElementById('near').onclick = nearMe;
      const so = document.getElementById('soMem'); if (so) so.onclick = async () => { await sb.auth.signOut(); load(); };
      bindCards();
      if (withMap) drawMap(rows, from);
    }
    function refreshList() {
      const { rows, from } = filtered();
      document.getElementById('list').innerHTML = rows.map(card).join('') || '<div class="empty">Nothing matches yet. Try another search or category.</div>';
      const cnt = document.querySelector('.count'); if (cnt) cnt.textContent = cnt.textContent.replace(/^\d+ listings?/, `${rows.length} ${rows.length === 1 ? 'listing' : 'listings'}`);
      bindCards(); if (map) drawMap(rows, from);
    }
    function card(l) {
      return `<button class="card ${l.featured ? 'feat' : ''}" data-lid="${l.id}">
        <div class="logo" ${l.logo ? `style="background-image:url('${esc(l.logo)}')"` : ''}>${l.logo ? '' : esc(initials(l.name))}</div>
        <div><h3>${esc(l.name)}${l.featured ? '<span class="tag">Featured</span>' : ''}</h3>
          <div class="sub">${esc(l.tagline || [l.city, l.state].filter(Boolean).join(', '))}</div>
          ${l._mi != null ? `<div class="dist">${l._mi < 0.1 ? 'Right here' : l._mi.toFixed(l._mi < 10 ? 1 : 0) + ' mi'}</div>` : ''}</div></button>`;
    }
    function bindCards() { document.querySelectorAll('[data-lid]').forEach((b) => (b.onclick = () => show(b.dataset.lid))); }
    function setHash() {
      const h = new URLSearchParams(); if (cat) h.set('c', cat); if (q) h.set('q', q);
      history.replaceState(null, '', location.pathname + location.search + (h.toString() ? '#' + h : ''));
    }
    function nearMe() {
      if (origin) { origin = null; render(); return; }
      if (!navigator.geolocation) return alertNote('Your browser can\'t share your location.');
      navigator.geolocation.getCurrentPosition((p) => { origin = { lat: p.coords.latitude, lng: p.coords.longitude }; originLabel = 'you'; render(); },
        () => alertNote('Location is turned off for this site, so we can\'t sort by distance.'), { timeout: 8000, maximumAge: 600000 });
    }
    function alertNote(m) { const b = document.getElementById('near'); if (b) { b.textContent = 'Location off'; b.title = m; } }

    function drawMap(rows, from) {
      if (!window.L) return;
      const el = document.getElementById('map'); if (!el) return;
      if (map && map.getContainer() !== el) { map.remove(); map = null; }
      if (!map) {
        map = L.map(el, { scrollWheelZoom: false });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
      }
      if (layer) layer.remove();
      layer = L.layerGroup().addTo(map);
      const pts = [];
      rows.filter((l) => l.lat != null).forEach((l) => {
        const m = L.circleMarker([l.lat, l.lng], { radius: l.featured ? 9 : 7, color: '#fff', weight: 2, fillColor: getComputedStyle(document.documentElement).getPropertyValue(l.featured ? '--a' : '--p').trim() || '#1A2A52', fillOpacity: 1 })
          .bindTooltip(l.name).on('click', () => show(l.id)).addTo(layer);
        pts.push([l.lat, l.lng]);
      });
      if (from) { L.circleMarker([from.lat, from.lng], { radius: 6, color: '#111', weight: 2, fillColor: '#fff', fillOpacity: 1 }).bindTooltip(originLabel || from.place || from.name || 'Here').addTo(layer); pts.push([from.lat, from.lng]); }
      if (pts.length > 1) map.fitBounds(pts, { padding: [28, 28], maxZoom: 15 }); else if (pts.length) map.setView(pts[0], 14); else map.setView([39.5, -98.35], 4);
    }

    let convTimer = null, convSig = '';
    async function conversation(tid, key, quiet = false) {
      const { data: t, error } = await sb.rpc('directory_thread_fetch', { p_thread: tid, p_key: key });
      // while the window is open, check for the business's reply every few seconds (and only redraw when something changed)
      clearTimeout(convTimer);
      if (quiet) { if (error || !t || !dlg.open) return; const sig = JSON.stringify(t.messages); if (sig === convSig) { convTimer = setTimeout(() => conversation(tid, key, true), 3000); return; } }
      convSig = t ? JSON.stringify(t.messages) : '';
      const draft = document.getElementById('cfB')?.value || '';
      if (error || !t) { dlg.innerHTML = `<div class="dbody"><p>This conversation link isn't valid anymore.</p><button class="btn" id="dx">Close</button></div>`; document.getElementById('dx').onclick = () => dlg.close(); if (!dlg.open) dlg.showModal(); return; }
      const when = (a) => new Date(a).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
      dlg.innerHTML = `<div class="dhead"><div><h2 id="dName">Your conversation with ${esc(t.business)}</h2><p>${esc(D.name)}</p></div><button class="x" id="dx" aria-label="Close">✕</button></div>
        <div class="dbody"><div class="livest"></div><div class="msgs">${t.messages.map((m) => `<div class="bub ${m.from === 'visitor' ? 'me' : ''}"><small>${m.from === 'visitor' ? 'You' : esc(t.business)} · ${esc(when(m.at))}</small>${esc(m.body)}</div>`).join('')}</div>
          <form class="form" id="cf"><label for="cfB">Reply</label><textarea id="cfB" required maxlength="4000"></textarea><div class="err" id="cfErr"></div><button class="btn" type="submit">Send</button></form></div>`;
      if (draft) document.getElementById('cfB').value = draft;
      const box = dlg.querySelector('.msgs'); if (box) box.scrollTop = box.scrollHeight;
      convTimer = setTimeout(() => conversation(tid, key, true), 3000);
      const st = dlg.querySelector('.livest'); if (st) st.innerHTML = t.business_online ? '<span class="dot on"></span> Online now. Replies show up here.' : '<span class="dot"></span> Away right now. Stay here, or we\'ll email you their reply.';
      document.getElementById('dx').onclick = () => dlg.close();
      dlg.onclose = () => { clearTimeout(convTimer); const h = new URLSearchParams(location.hash.slice(1)); h.delete('t'); h.delete('k'); history.replaceState(null, '', location.pathname + location.search + (h.toString() ? '#' + h : '')); };
      document.getElementById('cf').onsubmit = async (e) => {
        e.preventDefault(); const er = document.getElementById('cfErr'); er.textContent = '';
        const { error: e2 } = await sb.rpc('directory_thread_send', { p_thread: tid, p_key: key, p_body: document.getElementById('cfB').value });
        if (e2) { er.textContent = e2.message; return; }
        sb.functions.invoke('directory-email', { body: { kind: 'message', thread: tid, key } }).catch(() => {});
        document.getElementById('cfB').value = '';
        conversation(tid, key);
      };
      if (!dlg.open) dlg.showModal();
    }

    // the standard GELP chat, pointed at the business's own account (it stays in the corner while they browse)
    function openChat(c, open) {
      if (!window.GelpChat) { document.querySelector('script[src="/chat/widget.js"]')?.addEventListener('load', () => openChat(c, open), { once: true }); return; }
      const color = getComputedStyle(document.documentElement).getPropertyValue('--p').trim() || '#1A2A52';
      window.GelpChat.mount({ account: c.account, source: 'directory', ref: c.ref, name: c.name, label: 'Chat with ' + c.name, color, open });
      try { localStorage.setItem('dirChat:' + (D?.id || ''), JSON.stringify(c)); } catch {}
    }
    function show(id) {
      const l = D.listings.find((x) => x.id === id); if (!l) return;
      const a = addr(l), s = l.social || {};
      dlg.innerHTML = `<div class="dhead"><div class="logo" ${l.logo ? `style="background-image:url('${esc(l.logo)}')"` : ''}>${l.logo ? '' : esc(initials(l.name))}</div>
          <div><h2 id="dName">${esc(l.name)}</h2>${l.tagline ? `<p>${esc(l.tagline)}</p>` : ''}</div><button class="x" id="dx" aria-label="Close">✕</button></div>
        <div class="dbody">
          <div class="acts">
            ${l.phone ? `<a class="btn" href="${esc(tel(l.phone))}" data-t="call">Call ${esc(l.phone)}</a>` : ''}
            ${a ? `<a class="btn ghost" href="${esc(mapHref(l.name + ', ' + a))}" target="_blank" rel="noopener" data-t="directions">Directions</a>` : ''}
            ${l.website ? `<a class="btn ghost" href="${esc(site(l.website))}" target="_blank" rel="noopener nofollow" data-t="website">Website</a>` : ''}
          </div>
          ${a ? `<h4>Address</h4><p><a href="${esc(mapHref(l.name + ', ' + a))}" target="_blank" rel="noopener" data-t="directions">${esc(a)}</a></p>` : ''}
          ${l.description ? `<h4>About</h4><p>${esc(l.description)}</p>` : ''}
          ${l.hours ? `<h4>Hours</h4><p>${esc(l.hours)}</p>` : ''}
          ${(l.services || []).length ? `<h4>Services</h4><div class="svc">${l.services.map((x) => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
          ${s.facebook || s.instagram || s.linkedin ? `<h4>Follow</h4><p>${[['facebook', 'Facebook'], ['instagram', 'Instagram'], ['linkedin', 'LinkedIn']].filter(([k]) => s[k]).map(([k, n]) => `<a href="${esc(site(s[k]))}" target="_blank" rel="noopener nofollow">${n}</a>`).join(' · ')}</p>` : ''}
          ${(l.photos || []).length ? `<h4>Photos</h4><div class="gal">${l.photos.map((p) => `<figure style="margin:0"><a href="${esc(p.url)}" target="_blank" rel="noopener"><img src="${esc(p.url)}" alt="${esc(p.caption || l.name)}" loading="lazy"></a>${p.caption ? `<figcaption>${esc(p.caption)}</figcaption>` : ''}</figure>`).join('')}</div>` : ''}
          ${l.lat != null && window.L ? '<div id="dmap"></div>' : ''}
          ${l.messages && l.chat ? `<h4>Questions?</h4><p><button type="button" class="btn" id="dChat">Chat with ${esc(l.name)}</button></p>
            <p style="font-size:12px;color:var(--muted);margin:-4px 0 0">Live when they're in, and their reply comes to your email if you've stepped away.</p>` : ''}
          ${l.messages && !l.chat ? `<h4>Send a message</h4><form class="form" id="mf">
            <div class="two"><div><label for="mfN">Your name</label><input id="mfN" required maxlength="120" autocomplete="name"></div><div><label for="mfE">Your email</label><input id="mfE" type="email" required autocomplete="email"></div></div>
            <label for="mfP">Phone (optional)</label><input id="mfP" type="tel" autocomplete="tel">
            <label for="mfB">Message</label><textarea id="mfB" required maxlength="4000"></textarea>
            <div class="err" id="mfErr"></div><button class="btn" type="submit">Send message</button>
            <p style="font-size:12px;color:var(--muted);margin:8px 0 0">${esc(l.name)} gets your name, email and message. Their reply comes to your email.</p></form>` : ''}
        </div>`;
      dlg.querySelectorAll('[data-t]').forEach((x) => x.addEventListener('click', () => track(l.id, x.dataset.t)));
      const dc = document.getElementById('dChat');
      if (dc) dc.onclick = () => { dlg.close(); openChat({ account: l.chat, ref: l.id, name: l.name }, true); };
      const mf = document.getElementById('mf');
      if (mf) mf.onsubmit = async (e) => {
        e.preventDefault(); const er = document.getElementById('mfErr'); er.textContent = '';
        const btn = mf.querySelector('button'); btn.disabled = true; btn.textContent = 'Sending…';
        const { data, error } = await sb.rpc('directory_message_start', { p_listing: l.id, p_name: document.getElementById('mfN').value, p_email: document.getElementById('mfE').value,
          p_phone: document.getElementById('mfP').value, p_body: document.getElementById('mfB').value });
        if (error) { btn.disabled = false; btn.textContent = 'Send message'; er.textContent = error.message; return; }
        sb.functions.invoke('directory-email', { body: { kind: 'message', thread: data.thread, key: data.key } }).catch(() => {});
        try { localStorage.setItem('dirThread:' + l.id, JSON.stringify(data)); } catch {}
        // straight into the live chat
        history.replaceState(null, '', location.pathname + location.search + `#t=${data.thread}&k=${data.key}`);
        conversation(data.thread, data.key);
      };
      document.getElementById('dx').onclick = () => dlg.close();
      dlg.onclick = (e) => { if (e.target === dlg) dlg.close(); };
      dlg.onclose = () => { const h = new URLSearchParams(location.hash.slice(1)); h.delete('l'); history.replaceState(null, '', location.pathname + location.search + (h.toString() ? '#' + h : '')); };
      dlg.showModal();
      const h = new URLSearchParams(location.hash.slice(1)); h.set('l', l.id); history.replaceState(null, '', location.pathname + location.search + '#' + h);
      track(l.id, 'view');
      if (l.lat != null && window.L) {
        if (dmap) { dmap.remove(); dmap = null; }
        dmap = L.map('dmap', { scrollWheelZoom: false, zoomControl: false }).setView([l.lat, l.lng], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(dmap);
        L.circleMarker([l.lat, l.lng], { radius: 8, color: '#fff', weight: 2, fillColor: getComputedStyle(document.documentElement).getPropertyValue('--p').trim(), fillOpacity: 1 }).addTo(dmap);
      }
    }
  </script>
</body>
</html>
